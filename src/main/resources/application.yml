# Spring Boot configuration
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: vanavana978@gmail.com
    password: 'ceza qgzh xpim xkyt'
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  # Database
  datasource:
    driver-class-name: org.postgresql.Driver
    #    For local usage
    url: jdbc:postgresql://localhost:5432/link-shortening
    #    For docker
#    url: jdbc:postgresql://postgres/postgres
    username: postgres
    password: postgres
  # JPA properties
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    permit-all-management-endpoints: true
# Server configuration
server:
  port: 8080

front-end-url: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    org.springframework.boot.actuate: DEBUG
    io.micrometer: DEBUG

